const normalizeData=d=>{const out={...EMPTY(),...(d&&typeof d==='object'?d:{})};for(const k of Object.keys(EMPTY()))if(!Array.isArray(out[k]))out[k]=[];return out};
const saveLocal=()=>{try{localStorage.setItem(userCacheKey(),JSON.stringify(S));return true}catch(e){toast('Memoria del browser piena: elimina qualche immagine o esporta il backup.');return false}};
const save=()=>{dataRevision++;saveLocal();if(CLOUD&&currentUser){try{localStorage.setItem(pendingKey(currentUser.id),JSON.stringify(S))}catch(e){toast('Impossibile creare una copia locale di sicurezza: esporta un backup.')}cloudDirty=true;queueCloudSave()}};
function queueCloudSave(){clearTimeout(cloudTimer);if(!sb||!currentUser)return;cloudTimer=setTimeout(()=>{void cloudSave()},450)}
async function cloudSave(){
  if(!sb||!currentUser)return;
  if(cloudBusy){cloudDirty=true;return}
  const uid=currentUser.id,seq=++cloudSeq,revision=dataRevision;
  cloudBusy=true;cloudDirty=false;
  const payload=JSON.parse(JSON.stringify(S));
  let retry=true;
  try{
    const {error}=await sb.from('user_data').upsert({user_id:uid,data:payload,updated_at:new Date().toISOString()},{onConflict:'user_id'});
    if(error)throw error;
    cloudError='';
    if(currentUser?.id===uid&&revision===dataRevision){cloudDirty=false;try{localStorage.removeItem(pendingKey(uid))}catch(e){}}
    else if(currentUser?.id===uid){cloudDirty=true}
  }catch(e){cloudDirty=true;retry=false;cloudError='Salvataggio online non riuscito; copia locale conservata. '+(e?.message||'Controlla Supabase/RLS.');toast(cloudError)}
  finally{
    cloudBusy=false;
    if(currentUser && cloudDirty && seq===cloudSeq && (retry||currentUser.id!==uid))queueCloudSave();
  }
}
async function flushCloudSave(){
  if(!sb||!currentUser)return true;
  clearTimeout(cloudTimer);
  if(!cloudDirty&&!cloudBusy)return true;
  if(!cloudBusy)void cloudSave();
  const until=Date.now()+2200;
  while(currentUser&&cloudBusy&&Date.now()<until)await new Promise(r=>setTimeout(r,50));
  return !cloudBusy&&!cloudDirty;
}

let authBusy=false;

function unlockApp(session){
  if(!session?.user)return false;
  authGeneration++;
  currentUser=session.user;
  S=EMPTY();
  setLabName(currentLabName());
  authUI();
  document.body.classList.remove('auth-locked');

  if(o){o.hidden=true;o.innerHTML='';}

  V='home';E=null;location.hash='#home';
  render();

function lockApp(){
  authGeneration++;
  clearTimeout(cloudTimer);
  cloudDirty=false;
  cloudSeq++;
  currentUser=null;
  S=EMPTY();
  document.body.classList.add('auth-locked');
  setLabName('My Lab');

async function logout(){
  if(authBusy)return;
  authBusy=true;
  try{
    clearTimeout(cloudTimer);
    const ok=await flushCloudSave();
    if(sb){const {error}=await sb.auth.signOut();if(error)throw error}
    lockApp();
    V='home';E=null;PV='home';location.hash='#home';
    render();
    authModal();
    if(!ok)toast('Uscita completata. Modifiche conservate in questo browser e in attesa di sincronizzazione al prossimo accesso.');
  }catch(e){toast("Uscita dall'account non riuscita: "+(e?.message||'riprova.'))}
  finally{authBusy=false}
}


async function loadUserDataInBackground(){
  if(!sb||!currentUser)return;
  const uid=currentUser.id,generation=authGeneration,revisionAtStart=dataRevision;
  try{
    let pending=null;
    try{pending=JSON.parse(localStorage.getItem(pendingKey(uid))||'null')}catch(e){}
    if(pending&&typeof pending==='object'){
      if(dataRevision!==revisionAtStart)return;
      S=normalizeData(pending);saveLocal();render();cloudDirty=true;
      await cloudSave();
      return;
    }
    const {data,error}=await sb.from('user_data').select('data').eq('user_id',uid).maybeSingle();
    if(!currentUser || currentUser.id!==uid||authGeneration!==generation)return;
    if(error)throw error;
    if(dataRevision!==revisionAtStart)return;
    if(data?.data){
      const cloudData=normalizeData(data.data);
      const cached=(()=>{try{return JSON.parse(localStorage.getItem(`${K}.${uid}`)||'null')}catch(e){return null}})();
      if(hasSavedData(cached)&&JSON.stringify(normalizeData(cached))!==JSON.stringify(cloudData)){
        S=cloudData;cloudDirty=false;showImportChoice(normalizeData(cached),cloudData);render();return;
      }
      S=cloudData;
      cloudDirty=false;
      cloudError='';
      saveLocal();
    }else{
      const cached=(()=>{try{return JSON.parse(localStorage.getItem(`${K}.${uid}`)||'null')}catch(e){return null}})();
      const candidate=hasSavedData(cached)?cached:(hasSavedData(LOCAL)?LOCAL:null);
      S=EMPTY();cloudDirty=false;
      if(candidate){showImportChoice(candidate);render();return}
      const {error:insertError}=await sb.from('user_data').upsert({user_id:uid,data:S,updated_at:new Date().toISOString()},{onConflict:'user_id'});
      if(insertError)throw insertError;
      if(!currentUser || currentUser.id!==uid||authGeneration!==generation)return;
      if(dataRevision!==revisionAtStart)return;
      cloudError='';
      saveLocal();
    }
    render();
  }catch(e){
    if(currentUser?.id===uid&&authGeneration===generation){
      if(dataRevision===revisionAtStart){
        let cached=null;try{cached=JSON.parse(localStorage.getItem(`${K}.${uid}`)||'null')}catch(x){}
        if(hasSavedData(cached)){S=normalizeData(cached);saveLocal();try{localStorage.setItem(pendingKey(uid),JSON.stringify(S))}catch(x){}render()}
      }
      cloudError='Dati conservati nel browser, ma Supabase non li ha sincronizzati: '+(e?.message||'controlla la tabella user_data e le policy RLS.');
      toast(cloudError);
    }
  }
}


function authModal(){
  const o=$('#authov');
  if(currentUser){
    o.innerHTML=`<div class="authbox"><h2>Account</h2><p>Sei entrato nel tuo Lab.</p><p class="mut"><strong>${esc(currentLabName())}</strong><br>${esc(currentUser.email||'utente')}</p>${cloudError?`<p class="authmsg">${esc(cloudError)}</p>`:''}<div class="bar"><button class="gh" id="aclose">Chiudi</button><button class="pri" id="alogout">Esci dall’account</button></div></div>`;
    o.hidden=false;
    $('#aclose').onclick=()=>{o.hidden=true;o.innerHTML='';};
    $('#alogout').onclick=async()=>{
      const b=$('#alogout');
      if(b){b.disabled=true;b.textContent='Uscita…';}
      await logout();
    };
    return;
  }

  if(!CLOUD){
    o.innerHTML='<div class="authbox"><h2>Lab Note</h2><p>Il collegamento a Supabase non è disponibile in questa pagina. Ricarica il sito e controlla la connessione internet.</p></div>';
    o.hidden=false;
    return;
  }

  let mode='in';
  const renderAuth=()=>{
    o.innerHTML=`<div class="authbox">
      <h2>Lab Note · Accesso</h2>
      <p>Accedi al tuo diario di laboratorio. Ogni account ha dati separati.</p>
      <div class="bar"><button class="${mode==='in'?'pri':''}" id="tabIn">Accedi</button><button class="${mode==='up'?'pri':''}" id="tabUp">Crea account</button></div>
      <label>Email<input id="ae" type="email" autocomplete="email"></label>
      <label>Password<input id="ap" type="password" autocomplete="current-password"></label>
      ${mode==='up'?'<label>Nome del gruppo / Lab<input id="alab" type="text" maxlength="80" placeholder="Es. My Lab"></label>':''}
      <div class="authmsg" id="am">${esc(cloudError)}</div>
      <button class="pri" id="asubmit">${mode==='in'?'Accedi':'Crea account'}</button>
    </div>`;
    o.hidden=false;
    $('#tabIn').onclick=()=>{mode='in';renderAuth()};
    $('#tabUp').onclick=()=>{mode='up';renderAuth()};
    $('#asubmit').onclick=async()=>{
      if(authBusy)return;
      const am=$('#am');
      const email=$('#ae').value.trim(), password=$('#ap').value;
      if(!email||password.length<6){am.textContent='Inserisci email e una password di almeno 6 caratteri.';return}
      const lab=mode==='up'?$('#alab').value.trim():'';
      if(mode==='up'&&!lab){am.textContent='Inserisci il nome del gruppo / Lab.';return}
      authBusy=true;
      $('#asubmit').disabled=true;
      am.textContent=mode==='in'?'Accesso in corso…':'Creazione account…';
      try{
        if(mode==='in'){
          const {data,error}=await sb.auth.signInWithPassword({email,password});
          if(error)throw error;
          if(!unlockApp(data?.session))throw new Error('Supabase non ha restituito una sessione valida.');
          authInitialized=true;
          const ov=$('#authov'); if(ov){ov.hidden=true;ov.innerHTML='';}
          // Do not await database loading here.
          void loadUserDataInBackground();
          return;
        }

        const {data,error}=await sb.auth.signUp({email,password,options:{data:{lab_name:lab}}});
        if(error)throw error;
        if(data?.session){
          unlockApp(data.session);
          authInitialized=true;
          const ov=$('#authov'); if(ov){ov.hidden=true;ov.innerHTML='';}
          void loadUserDataInBackground();
          return;
        }

        // Autoconfirm is disabled: tell the user exactly what remains to do.
        am.textContent='Account creato. Devi confermare la tua email prima di poter entrare. Dopo la conferma torna qui e usa Accedi.';
        mode='in';
        setTimeout(renderAuth,2500);
      }catch(e){
        am.textContent=e?.message||'Impossibile completare la richiesta.';
      }finally{
        authBusy=false;
        const b=$('#asubmit');
        if(b)b.disabled=false;
      }
    };
  };
  renderAuth();
}

async function initCloud(){
  lockApp();
  if(!sb){
    authModal();
    return;
  }

  // IMPORTANT: do not make asynchronous Supabase calls inside onAuthStateChange.
  // Supabase documents a known deadlock when an async call is made from that callback.
  // We therefore use getSession() once at startup and handle sign-in/sign-out directly.
  try{
    const {data,error}=await sb.auth.getSession();
    if(error)throw error;
    if(unlockApp(data?.session)){
      authInitialized=true;
      void loadUserDataInBackground();
    }else{
      authModal();
    }
  }catch(e){
    lockApp();
    authModal();
    const msg=e?.message||'Impossibile verificare la sessione.';
    const am=$('#am');
    if(am)am.textContent=msg;
    toast(msg);
  }
}
