<style>
:root{--bg:#fff;--ink:#0a0a0a;--mut:#46464f;--card:#f2eefc;--ac:#5a14ff;--onac:#fff;--ac2:#ff4d00;--mk:#ffe600;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

.dg{border-color:var(--ac2);color:var(--ac2)}.dg:hover{background:var(--ac2);color:var(--bg)}
.gh{border-color:transparent;text-decoration:underline}
input,textarea{width:100%;background:var(--bg);border:2px solid var(--ink);padding:.55rem .7rem}

#q{max-width:340px}

select{width:100%;background:var(--bg);border:2px solid var(--ink);padding:.55rem .7rem}

@media(max-width:640px){.nb{padding-left:3.4rem;font-size:1.15rem}.nb::before{left:.2rem}.nb::after{left:2.6rem}}

.stat{border:3px solid var(--ink);padding:.8rem 1rem;background:var(--bg);box-shadow:4px 4px 0 var(--ink)}.stat b{display:block;font-size:2rem;line-height:1.1;color:var(--ac)}.stat span{font-size:.8rem;font-weight:700;text-transform:uppercase;color:var(--mut)}

.wh{width:100%;text-align:left;border:0;border-bottom:2px solid var(--ink);margin-bottom:.3rem;padding:.3rem;font-size:.85rem;text-transform:capitalize}.wh.t{background:var(--ac);color:var(--onac)}

.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.3rem 1rem;width:100%;text-align:left;margin-top:.5rem;font-weight:600}
.res{display:block;width:100%;text-align:left;margin-bottom:.8rem;font-weight:400}.tag{display:inline-block;background:var(--ink);color:var(--bg);font-size:.7rem;font-weight:800;text-transform:uppercase;padding:0 .5rem;margin-right:.5rem}
.bd{background:var(--ac2);color:var(--bg);padding:0 .4rem;font-weight:700;font-size:.8rem}

@media(max-width:520px){.row{grid-template-columns:1fr}}
.sws{border:0;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}.sws legend{font-size:.8rem;font-weight:700;text-transform:uppercase;padding:0;margin-bottom:.3rem}

.tile,.stat,.pcard{background:linear-gradient(135deg,#08264f 0%,var(--c) 100%);color:#fff;border-color:var(--ink)}
.tile{font-weight:800}.tile small{opacity:1;font-weight:500}.tile:hover,.pcard:hover{background:linear-gradient(135deg,#08264f 0%,var(--c) 100%);color:#fff;filter:brightness(1.15)}
.stat b,.stat span{color:#fff}

<script>
const $=s=>document.querySelector(s),K='labnote.v1';
const SUPABASE_URL='https://tcsexoyqkhupigdiieuh.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_6EG4e9tD1TzBCe9DhrVbCg_U5sgr9cc';
const SUPABASE_SDK=window.supabase;
const CLOUD=!!SUPABASE_SDK && SUPABASE_URL.startsWith('https://') && SUPABASE_ANON_KEY.length>20 && !SUPABASE_URL.includes('YOUR_');
const sb=CLOUD?SUPABASE_SDK.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
const EMPTY=()=>({acts:[],plans:[],inc:[],ct:[],smp:[],stk:[]});
const legacyLoad=()=>{try{const d=JSON.parse(localStorage.getItem(K));if(d&&Array.isArray(d.acts))return {...EMPTY(),...d}}catch(e){}return EMPTY()};
let LOCAL=legacyLoad(),S=EMPTY(),V='home',PV='home',R=0,E=null,Q='',tt,currentUser=null,cloudTimer=null,cloudBusy=false,cloudDirty=false,cloudSeq=0,dataRevision=0,authGeneration=0,cloudError='',LAB_NAME='My Lab';
const setLabName=name=>{LAB_NAME=(String(name||'').trim()||'My Lab').slice(0,80);document.title='Lab Note · '+LAB_NAME;const a=$('#labNameTop'),b=$('#labNameHero');if(a)a.textContent=LAB_NAME;if(b)b.textContent=LAB_NAME};
const currentLabName=()=>String(currentUser?.user_metadata?.lab_name||'').trim()||'My Lab';
if(!CLOUD)S={...EMPTY(),...LOCAL};
for(const k of['acts','plans','inc','ct','smp','stk'])if(!Array.isArray(S[k]))S[k]=[];
const userCacheKey=()=>currentUser?`${K}.${currentUser.id}`:K;
const now=new Date();let CY=now.getFullYear(),CM=now.getMonth();
const pendingKey=uid=>`${K}.pending.${uid}`;
const normalizeData=d=>{const out={...EMPTY(),...(d&&typeof d==='object'?d:{})};for(const k of Object.keys(EMPTY()))if(!Array.isArray(out[k]))out[k]=[];return out};
const saveLocal=()=>{try{localStorage.setItem(userCacheKey(),JSON.stringify(S));return true}catch(e){toast('Memoria del browser piena: elimina qualche immagine o esporta il backup.');return false}};
const save=()=>{dataRevision++;saveLocal();if(CLOUD&&currentUser){try{localStorage.setItem(pendingKey(currentUser.id),JSON.stringify(S))}catch(e){toast('Impossibile creare una copia locale di sicurezza: esporta un backup.')}cloudDirty=true;queueCloudSave()}};
function queueCloudSave(){clearTimeout(cloudTimer);if(!sb||!currentUser)return;cloudTimer=setTimeout(()=>{void cloudSave()},450)}
async function cloudSave(){
  if(!sb||!currentUser)return;
  if(cloudBusy){cloudDirty=true;return}
  const uid=currentUser.id,seq=++cloudSeq,revision=dataRevision;
  cloudBusy=true;cloudDirty=false;
  const payload=JSON.parse(JSON.stringify(S));
  let retry=true;
  try{
    const {error}=await sb.from('user_data').upsert({user_id:uid,data:payload,updated_at:new Date().toISOString()},{onConflict:'user_id'});
    if(error)throw error;
    cloudError='';
    if(currentUser?.id===uid&&revision===dataRevision){cloudDirty=false;try{localStorage.removeItem(pendingKey(uid))}catch(e){}}
    else if(currentUser?.id===uid){cloudDirty=true}
  }catch(e){cloudDirty=true;retry=false;cloudError='Salvataggio online non riuscito; copia locale conservata. '+(e?.message||'Controlla Supabase/RLS.');toast(cloudError)}
  finally{
    cloudBusy=false;
    if(currentUser && cloudDirty && seq===cloudSeq && (retry||currentUser.id!==uid))queueCloudSave();
  }
}
async function flushCloudSave(){
  if(!sb||!currentUser)return true;
  clearTimeout(cloudTimer);
  if(!cloudDirty&&!cloudBusy)return true;
  if(!cloudBusy)void cloudSave();
  const until=Date.now()+2200;
  while(currentUser&&cloudBusy&&Date.now()<until)await new Promise(r=>setTimeout(r,50));
  return !cloudBusy&&!cloudDirty;
}
async function cloudLoad(){return loadUserDataInBackground()}
const hasSavedData=d=>!!d&&['acts','plans','inc','ct','smp','stk'].some(k=>Array.isArray(d[k])&&d[k].length>0);
function showImportChoice(data,existingCloud=null){if(!hasSavedData(data))return false;const conflict=!!existingCloud;const close=mdl(MH('Dati locali trovati')+`<p>${conflict?'La copia locale di questo account è diversa dai dati online. Vuoi ripristinare la copia locale oppure mantenere quella online?':'Questo browser contiene dati salvati localmente che non risultano ancora nel tuo account. Vuoi importarli?'}</p><div class="bar"><button class="pri" id="impLocal">${conflict?'Ripristina copia locale':'Importa dati'}</button><button class="gh" id="skipLocal">${conflict?'Mantieni dati online':'Inizia senza importarli'}</button></div>`);$('#impLocal').onclick=async()=>{S=normalizeData(data);save();const ok=await flushCloudSave();if(ok){close();render();toast('Dati locali importati e salvati nel tuo account.')}else toast('Importazione in attesa: la copia locale è conservata e verrà ritentata al prossimo accesso.')};$('#skipLocal').onclick=async()=>{close();S=conflict?normalizeData(existingCloud):EMPTY();save();const ok=await flushCloudSave();render();if(!ok)toast('Profilo inizializzato localmente; sincronizzazione cloud in attesa.')} ;return true}
function authUI(){
  const b=$('#auth');
  if(!b)return;
  if(!CLOUD){b.textContent='Accedi';b.title='Configura il login online per usare gli account';return}
  if(currentUser)b.innerHTML=`Account<small>${esc(currentUser.email||'utente')}</small>`;
  else b.textContent='Accedi';

let authBusy=false;
let authInitialized=false;

function unlockApp(session){
  if(!session?.user)return false;
  authGeneration++;
  currentUser=session.user;
  S=EMPTY();
  setLabName(currentLabName());
  authUI();
  document.body.classList.remove('auth-locked');
  const o=$('#authov');
  if(o){o.hidden=true;o.innerHTML='';}
  // Every successful authentication always lands on the dashboard.
  V='home';E=null;location.hash='#home';
  render();
  return true;
}

function lockApp(){
  authGeneration++;
  clearTimeout(cloudTimer);
  cloudDirty=false;
  cloudSeq++;
  currentUser=null;
  S=EMPTY();
  document.body.classList.add('auth-locked');
  setLabName('My Lab');
  authUI();
}

async function logout(){
  if(authBusy)return;
  authBusy=true;
  try{
    clearTimeout(cloudTimer);
    const ok=await flushCloudSave();
    if(sb){const {error}=await sb.auth.signOut();if(error)throw error}
    lockApp();
    V='home';E=null;PV='home';location.hash='#home';
    render();
    authModal();
    if(!ok)toast('Uscita completata. Modifiche conservate in questo browser e in attesa di sincronizzazione al prossimo accesso.');
  }catch(e){toast("Uscita dall'account non riuscita: "+(e?.message||'riprova.'))}
  finally{authBusy=false}
}


async function loadUserDataInBackground(){
  if(!sb||!currentUser)return;
  const uid=currentUser.id,generation=authGeneration,revisionAtStart=dataRevision;
  try{
    let pending=null;
    try{pending=JSON.parse(localStorage.getItem(pendingKey(uid))||'null')}catch(e){}
    if(pending&&typeof pending==='object'){
      if(dataRevision!==revisionAtStart)return;
      S=normalizeData(pending);saveLocal();render();cloudDirty=true;
      await cloudSave();
      return;
    }
    const {data,error}=await sb.from('user_data').select('data').eq('user_id',uid).maybeSingle();
    if(!currentUser || currentUser.id!==uid||authGeneration!==generation)return;
    if(error)throw error;
    if(dataRevision!==revisionAtStart)return;
    if(data?.data){
      const cloudData=normalizeData(data.data);
      const cached=(()=>{try{return JSON.parse(localStorage.getItem(`${K}.${uid}`)||'null')}catch(e){return null}})();
      if(hasSavedData(cached)&&JSON.stringify(normalizeData(cached))!==JSON.stringify(cloudData)){
        S=cloudData;cloudDirty=false;showImportChoice(normalizeData(cached),cloudData);render();return;
      }
      S=cloudData;
      cloudDirty=false;
      cloudError='';
      saveLocal();
    }else{
      const cached=(()=>{try{return JSON.parse(localStorage.getItem(`${K}.${uid}`)||'null')}catch(e){return null}})();
      const candidate=hasSavedData(cached)?cached:(hasSavedData(LOCAL)?LOCAL:null);
      S=EMPTY();cloudDirty=false;
      if(candidate){showImportChoice(candidate);render();return}
      const {error:insertError}=await sb.from('user_data').upsert({user_id:uid,data:S,updated_at:new Date().toISOString()},{onConflict:'user_id'});
      if(insertError)throw insertError;
      if(!currentUser || currentUser.id!==uid||authGeneration!==generation)return;
      if(dataRevision!==revisionAtStart)return;
      cloudError='';
      saveLocal();
    }
    render();
  }catch(e){
    if(currentUser?.id===uid&&authGeneration===generation){
      if(dataRevision===revisionAtStart){
        let cached=null;try{cached=JSON.parse(localStorage.getItem(`${K}.${uid}`)||'null')}catch(x){}
        if(hasSavedData(cached)){S=normalizeData(cached);saveLocal();try{localStorage.setItem(pendingKey(uid),JSON.stringify(S))}catch(x){}render()}
      }
      cloudError='Dati conservati nel browser, ma Supabase non li ha sincronizzati: '+(e?.message||'controlla la tabella user_data e le policy RLS.');
      toast(cloudError);
    }
  }
}


function authModal(){
  const o=$('#authov');
  if(currentUser){
    o.innerHTML=`<div class="authbox"><h2>Account</h2><p>Sei entrato nel tuo Lab.</p><p class="mut"><strong>${esc(currentLabName())}</strong><br>${esc(currentUser.email||'utente')}</p>${cloudError?`<p class="authmsg">${esc(cloudError)}</p>`:''}<div class="bar"><button class="gh" id="aclose">Chiudi</button><button class="pri" id="alogout">Esci dall’account</button></div></div>`;
    o.hidden=false;
    $('#aclose').onclick=()=>{o.hidden=true;o.innerHTML='';};
    $('#alogout').onclick=async()=>{
      const b=$('#alogout');
      if(b){b.disabled=true;b.textContent='Uscita…';}
      await logout();
    };
    return;
  }

  if(!CLOUD){
    o.innerHTML='<div class="authbox"><h2>Lab Note</h2><p>Il collegamento a Supabase non è disponibile in questa pagina. Ricarica il sito e controlla la connessione internet.</p></div>';
    o.hidden=false;
    return;
  }

  let mode='in';
  const renderAuth=()=>{
    o.innerHTML=`<div class="authbox">
      <h2>Lab Note · Accesso</h2>
      <p>Accedi al tuo diario di laboratorio. Ogni account ha dati separati.</p>
      <div class="bar"><button class="${mode==='in'?'pri':''}" id="tabIn">Accedi</button><button class="${mode==='up'?'pri':''}" id="tabUp">Crea account</button></div>
      <label>Email<input id="ae" type="email" autocomplete="email"></label>
      <label>Password<input id="ap" type="password" autocomplete="current-password"></label>
      ${mode==='up'?'<label>Nome del gruppo / Lab<input id="alab" type="text" maxlength="80" placeholder="Es. Ceppi Lab"></label>':''}
      <div class="authmsg" id="am">${esc(cloudError)}</div>
      <button class="pri" id="asubmit">${mode==='in'?'Accedi':'Crea account'}</button>
    </div>`;
    o.hidden=false;
    $('#tabIn').onclick=()=>{mode='in';renderAuth()};
    $('#tabUp').onclick=()=>{mode='up';renderAuth()};
    $('#asubmit').onclick=async()=>{
      if(authBusy)return;
      const am=$('#am');
      const email=$('#ae').value.trim(), password=$('#ap').value;
      if(!email||password.length<6){am.textContent='Inserisci email e una password di almeno 6 caratteri.';return}
      const lab=mode==='up'?$('#alab').value.trim():'';
      if(mode==='up'&&!lab){am.textContent='Inserisci il nome del gruppo / Lab.';return}
      authBusy=true;
      $('#asubmit').disabled=true;
      am.textContent=mode==='in'?'Accesso in corso…':'Creazione account…';
      try{
        if(mode==='in'){
          const {data,error}=await sb.auth.signInWithPassword({email,password});
          if(error)throw error;
          if(!unlockApp(data?.session))throw new Error('Supabase non ha restituito una sessione valida.');
          authInitialized=true;
          const ov=$('#authov'); if(ov){ov.hidden=true;ov.innerHTML='';}
          // Do not await database loading here.
          void loadUserDataInBackground();
          return;
        }

        const {data,error}=await sb.auth.signUp({email,password,options:{data:{lab_name:lab}}});
        if(error)throw error;
        if(data?.session){
          unlockApp(data.session);
          authInitialized=true;
          const ov=$('#authov'); if(ov){ov.hidden=true;ov.innerHTML='';}
          void loadUserDataInBackground();
          return;
        }

        // Autoconfirm is disabled: tell the user exactly what remains to do.
        am.textContent='Account creato. Devi confermare la tua email prima di poter entrare. Dopo la conferma torna qui e usa Accedi.';
        mode='in';
        setTimeout(renderAuth,2500);
      }catch(e){
        am.textContent=e?.message||'Impossibile completare la richiesta.';
      }finally{
        authBusy=false;
        const b=$('#asubmit');
        if(b)b.disabled=false;
      }
    };
  };
  renderAuth();
}

async function initCloud(){
  lockApp();
  if(!sb){
    authModal();
    return;
  }

  // IMPORTANT: do not make asynchronous Supabase calls inside onAuthStateChange.
  // Supabase documents a known deadlock when an async call is made from that callback.
  // We therefore use getSession() once at startup and handle sign-in/sign-out directly.
  try{
    const {data,error}=await sb.auth.getSession();
    if(error)throw error;
    if(unlockApp(data?.session)){
      authInitialized=true;
      void loadUserDataInBackground();
    }else{
      authModal();
    }
  }catch(e){
    lockApp();
    authModal();
    const msg=e?.message||'Impossibile verificare la sessione.';
    const am=$('#am');
    if(am)am.textContent=msg;
    toast(msg);
  }
}
